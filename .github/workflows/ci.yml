name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Security regressions
        run: bun run test:security
      - name: Build
        run: bun run build
